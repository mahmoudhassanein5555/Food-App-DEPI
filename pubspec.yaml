name: food_app_depi
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Renders the exact SVG icons exported from Figma (pixel-identical to the
  # design, instead of an approximated icon font). Drop exported .svg files
  # into assets/icons/ and reference them with SvgPicture.asset(...).
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
